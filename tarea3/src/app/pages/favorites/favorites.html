<section id="favorites-section">
    <h2>Mis favoritas</h2>
    <div id="favorites-grid">
        @for (movie of favoritesService.favoritesList(); track movie.id) {
            <app-movie-card
                [movie]="movie"
                [showRemoveButton]="true"
                (remove)="favoritesService.remove($event.id)">
            </app-movie-card>
        }
        @empty {
            <p>Aún no tienes películas favoritas.</p>
        }
    </div>
</section>
