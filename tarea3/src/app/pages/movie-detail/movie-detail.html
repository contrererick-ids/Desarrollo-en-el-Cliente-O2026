<a routerLink="/"> &lt; Regresar</a>

@if (movie(); as movie) {
    <div class="movie-details-section">
        <div class="movie-header">
            <h1>{{movie.title}}</h1>
        </div>
        <button (click)="toggleFavorite(movie)">
            {{ favoritesService.isFavorite(movie.id) ? 'Quitar de favoritos' : 'Agregar a favoritos' }}
        </button>
        <div class="movie-description">

        </div>
    </div>
}
@else {
    <p>No encontramos esta película.</p>
}
