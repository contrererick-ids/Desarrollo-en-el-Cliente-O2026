@if (movie(); as movie) {
    <div id="movie-details-section">
        <div class="return-button">
            <a routerLink="/"> &lt; Regresar</a>
        </div>
        <div class="movie-header">
            <div class="main-details">
                <h1>{{movie.title}}</h1>
                <h3>Director: {{movie.director}}</h3>
                <h3>Año: {{movie.year}}</h3>
                <h3>Género: {{movie.genre}}</h3>
                <button (click)="toggleFavorite(movie)">
                    @if (!favoritesService.isFavorite(movie.id)) {
                        <i class="bi bi-star"></i>
                    }@else {
                        <i class="bi bi-star-fill"></i>
                    }
                </button>
                <p>{{movie.description}}</p>
            </div>
            <div class="image-container">
                <img src={{movie?.imgURL}} alt="img_not_found">
            </div>
        </div>
    </div>
}
@else {
    <p>No encontramos esta película.</p>
}
